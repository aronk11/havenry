name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Binaries bauen
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          # Der Agent laeuft auf vielen kleinen Hosts — arm64 ist Pflicht,
          # nicht Kuer (ADR-0020).
          for target in linux/amd64 linux/arm64 linux/arm; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/havenry-agent-$os-$arch" ./cmd/havenry-agent
          done
          # Die Control Plane braucht vorerst CGO und damit den Bau auf der
          # Zielarchitektur — siehe ADR-0020 und scripts/switch-to-pure-go-sqlite.sh
          CGO_ENABLED=1 go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o dist/havenry-linux-amd64 ./cmd/havenry

      - name: Changelog aus den Commits
        id: changelog
        run: |
          # Conventional Commits sind die Quelle (ADR-0016). Deshalb prueft
          # die Pipeline sie bei jedem Push — sonst faellt es erst hier auf.
          prev="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"
          range="${prev:+$prev..}HEAD"

          {
            echo "## Änderungen"
            echo
            for pair in "feat:Neu" "fix:Behoben" "perf:Schneller" "refactor:Umbau" "docs:Dokumentation"; do
              type="${pair%%:*}"; label="${pair##*:}"
              entries="$(git log "$range" --format='%s' --grep="^$type" || true)"
              [ -z "$entries" ] && continue
              echo "### $label"
              printf '%s\n' "$entries" | sed -E "s/^$type(\([^)]*\))?!?: /- /"
              echo
            done

            breaking="$(git log "$range" --format='%s%n%b' | grep -E '^BREAKING CHANGE:|^[a-z]+(\(.+\))?!:' || true)"
            if [ -n "$breaking" ]; then
              echo "### Brechende Änderungen"
              printf '%s\n' "$breaking" | sed 's/^/- /'
            fi
          } > CHANGELOG_RELEASE.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG_RELEASE.md
          files: dist/*
          draft: true

  # Container-Images für amd64 und arm64 — von ADR-0016 verlangt, arm64 ist in
  # dieser Zielgruppe Pflicht, nicht Kür (viele kleine Homelab-Hosts).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten für havenry (Control Plane)
        id: meta-havenry
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/havenry
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=raw,value=latest

      - name: havenry bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # linux/arm/v7 fehlt hier bewusst: CGO_ENABLED=1 (ADR-0020) macht
          # den Cross-Compile für diese Architektur teuer und fehleranfällig,
          # der Agent unten deckt arm/v7 ab. Fällt mit dem Treiberwechsel weg.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-havenry.outputs.tags }}
          labels: ${{ steps.meta-havenry.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Metadaten für havenry-agent
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/havenry-agent
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=raw,value=latest

      - name: havenry-agent bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
