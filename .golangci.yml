# Bewusst schlank: Linter, die häufig falsch anschlagen, sind aus. Ein Linter,
# den man ständig unterdrückt, erzieht dazu, Warnungen zu ignorieren.
run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - gosec
  # misspell fehlt bewusst: Es prüft gegen ein englisches Wörterbuch und
  # markiert in dieser deutsch kommentierten Codebase reihenweise echte Wörter
  # als Tippfehler ("Synchronisation", "Autor", "Konfiguration" — es kennt sie
  # als Falschschreibungen ihrer englischen Pendants). Genau der Fall aus der
  # Überschrift oben: ein Linter, der ständig falsch anschlägt.

linters-settings:
  gosec:
    excludes:
      # G104 überschneidet sich mit errcheck.
      - G104

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        # api_auth_test.go schließt den Response-Body zentral im
        # apiClient.do()-Helfer, bevor er zurückgegeben wird — bodyclose sieht
        # den Aufruf an der Rückgabestelle nicht und schlägt an jeder
        # Verwendungsstelle in dieser Datei falsch an.
        - bodyclose
